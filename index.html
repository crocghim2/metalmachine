<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetalMachine | Arta Fierului pe Roți</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #f1c40f; /* Galben industrial / fier ars */
            --dark: #121315;          /* Gri-negru metalizat închis */
            --silver-light: #e0e6ed;  /* Argintiu deschis pentru text */
            --silver-metal: #a1b0bd;  /* Argintiu mat / oțel */
            --card-bg: #1a1c20;       /* Gri închis pentru panouri */
            --text-muted: #888;
            --accent: #e67e22;        /* Portocaliu de foc la selecție */
        }

        /* Activare derulare lină (Smooth Scroll) */
        html {
            scroll-behavior: smooth;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: var(--dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        h1, h2, h3 { font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 2px; }

        /* --- NAVIGATION --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(18, 19, 21, 0.98);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--silver-metal);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo { 
            font-weight: 900; 
            font-size: 1.6rem; 
            color: var(--primary); 
            letter-spacing: 1.5px; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7); 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span { color: #fff; }
        /* Iconița mecanică galbenă din meniu */
        .logo i { font-size: 1.8rem; color: var(--primary); animation: spin 20s linear infinite; }

        nav ul { display: flex; list-style: none; align-items: center; }
        nav ul li { margin-left: 30px; }
        nav ul li a { text-decoration: none; color: var(--silver-light); font-size: 0.9rem; font-weight: 600; transition: 0.3s; position: relative; padding-bottom: 5px; text-transform: uppercase; }
        nav ul li a:hover { color: var(--accent); }
        nav ul li a::after { content: ''; display: block; width: 0; height: 3px; background: var(--accent); transition: width .3s; position: absolute; bottom: 0; left: 0; }
        nav ul li a:hover::after { width: 100%; }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(18, 19, 21, 0.7), rgba(18, 19, 21, 0.85)), url('https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            border-bottom: 3px solid var(--primary);
        }

        .hero h1 { font-size: 4.5rem; font-weight: 900; color: #fff; margin-bottom: 20px; text-shadow: 3px 3px 15px rgba(0,0,0,0.9); }
        .hero h1 span { color: var(--primary); }
        .hero p { font-size: 1.25rem; color: var(--silver-light); max-width: 600px; margin-bottom: 30px; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }
        
        .btn {
            background-color: var(--primary);
            color: #000;
            padding: 16px 45px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
        }
        .btn:hover { background-color: var(--accent); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(241, 196, 15, 0.5); }

        /* --- POVESTE SECTION (Poza ta fără cerc) --- */
        .story { padding: 140px 5% 80px 5%; display: flex; align-items: center; gap: 50px; flex-wrap: wrap; background: linear-gradient(180deg, var(--dark), #1d1f24); }
        .story-text { flex: 1; min-width: 300px; }
        .story-text h2 { color: var(--primary); margin-bottom: 20px; font-size: 2.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .story-text p { margin-bottom: 20px; color: var(--silver-light); font-size: 1.1rem; }
        .story-img { flex: 1; min-width: 300px; text-align: center; }
