<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetalMachine | Machete din Fier</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #e67e22; --dark: #111215; --silver-bright: #f0f2f5; --silver-metal: #adb5bd; --card-bg: #1a1c20; --sidebar-width: 260px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Open Sans', sans-serif; background-color: var(--dark); color: var(--silver-bright); display: flex; }
        
        /* SISTEM LIMBĂ */
        .en { display: none !important; }
        body.lang-en .ro { display: none !important; }
        body.lang-en .en { display: block !important; }
        
        nav { position: fixed; width: var(--sidebar-width); height: 100vh; background: #0d0e10; border-right: 2px solid var(--silver-metal); padding: 40px 20px; z-index: 1000; }
        .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.4rem; color: var(--primary); text-align: center; margin-bottom: 30px; }
        nav ul { list-style: none; display: flex; flex-direction: column; gap: 15px; }
        nav ul li a { text-decoration: none; color: var(--silver-metal); cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px; transition: 0.3s; }
        nav ul li a.active, nav ul li a:hover { color: var(--primary); }
        
        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); min-height: 100vh; padding: 60px 5%; }
        .rubrica { display: none; }
        .rubrica.active { display: block; }
        
        .form-box { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 40px; border-radius: 6px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #121316; border: 1px solid #3a3f4a; color: white; border-radius: 4px; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px; cursor: pointer; width: 100%; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        
        @media (max-width: 768px) { body { flex-direction: column; } nav { position: relative; width: 100%; height: auto; } .main-content { margin-left: 0; width: 100%; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo">METAL<span>MACHINE</span></div>
        <div style="text-align: center; margin-bottom: 20px;">
            <button onclick="schimbaLimba('ro')">RO</button> <button onclick="schimbaLimba('en')">EN</button>
        </div>
        <ul>
            <li><a onclick="arataRubrica('acasa')" class="active"><i class="fa-solid fa-house"></i> <span class="ro">Acasă</span><span class="en">Home</span></a></li>
            <li><a onclick="arataRubrica('comanda')"><i class="fa-solid fa-envelope"></i> <span class="ro">Comandă</span><span class="en">Order</span></a></li>
            <li><a onclick="arataRubrica('login')"><i class="fa-solid fa-lock"></i> Admin</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div id="acasa" class="rubrica active"><h1>FĂURIT DIN <span>FIER</span></h1></div>
        
        <div id="comanda" class="rubrica">
            <div class="form-box">
                <form action="https://formsubmit.co/EMAIL_UL_TAU" method="POST">
                    <input type="text" name="nume" placeholder="Nume" required>
                    <button type="submit" class="btn">Trimite</button>
                </form>
            </div>
        </div>

        <div id="login" class="rubrica">
            <div class="form-box">
                <h2>Admin Login</h2>
                <div id="auth-form">
                    <input type="email" id="email" placeholder="Email">
                    <input type="password" id="password" placeholder="Parolă">
                    <button id="login-btn" class="btn">Intră</button>
                </div>
                <button id="logout-btn" class="btn" style="display:none; background:#555;">Ieși</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXMHHuAwefEoVYJZh8eiEFu2l6q-fmLpI",
            authDomain: "metalic2.firebaseapp.com",
            projectId: "metalic2",
            storageBucket: "metalic2.firebasestorage.app",
            messagingSenderId: "1025361495548",
            appId: "1:1025361495548:web:4df635aec57ad392a99e79"
        };
        const auth = getAuth(initializeApp(firebaseConfig));

        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(err => alert(err.message));
        });
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            document.getElementById('auth-form').style.display = user ? 'none' : 'block';
            document.getElementById('logout-btn').style.display = user ? 'block' : 'none';
        });
    </script>

    <script>
        function arataRubrica(id) {
            document.querySelectorAll('.rubrica').forEach(r => r.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function schimbaLimba(lang) {
            document.body.className = (lang === 'en') ? 'lang-en' : '';
        }
    </script>
</body>
</html>
